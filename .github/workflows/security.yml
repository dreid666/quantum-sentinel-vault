name: EDGE Core Sentinel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run EDGE Core Sentinel AST Scan
        run: python3 agent_core/edge_sentinel.py

      - name: Run Stateful Invariant Fuzzing
        env:
          FOUNDRY_INVARIANT_RUNS: 5000
        run: forge test --gas-report

      - name: Install Slither
        run: python -m pip install slither-analyzer==0.11.6

      - name: Run Slither Static Analysis
        run: slither . --exclude-low --exclude-informational --fail-medium

      - name: Ensure no lingering backup file
        run: |
          if [ -f src/Vault.sol.bak ]; then
            echo "Lingering src/Vault.sol.bak found" >&2
            exit 1
          fi
